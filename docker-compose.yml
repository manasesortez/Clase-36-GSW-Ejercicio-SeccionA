# Clase 36 - Ejercicio integrador (Sección A): plataforma de votación en alta disponibilidad
#   Usuario -> lb (Nginx, puerto 8089) -> nodo1 / nodo2 / nodo3 (red privada clusternet)
#
# Antes de levantar:
#   1. docker build -t votacion-a-app ./app
#   2. Crear nginx/nginx.conf (el balanceador)

services:
  nodo1:
    image: votacion-a-app
    hostname: nodo1
    # Sin "ports": los nodos NO se publican hacia afuera, solo el balanceador.
    volumes:
      - ./datos:/app/data        # los 3 nodos comparten la misma carpeta de votos
    networks:
      clusternet:
        ipv4_address: 172.22.0.11
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9095/health"]
      interval: 5s
      retries: 2

  nodo2:
    image: votacion-a-app
    hostname: nodo2
    volumes:
      - ./datos:/app/data
    networks:
      clusternet:
        ipv4_address: 172.22.0.12
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9095/health"]
      interval: 5s
      retries: 2

  nodo3:
    image: votacion-a-app
    hostname: nodo3
    volumes:
      - ./datos:/app/data
    networks:
      clusternet:
        ipv4_address: 172.22.0.13
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9095/health"]
      interval: 5s
      retries: 2

  lb:
    image: nginx:alpine
    ports: ["8089:80"]           # único puerto abierto hacia afuera
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro   # READ ONLY (solo lectura)
    networks: ["clusternet"]
    depends_on: [nodo1, nodo2, nodo3]

networks:
  clusternet:
    ipam:
      config:
        - subnet: 172.22.0.0/24
