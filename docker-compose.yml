# Clase 36 - Ejercicio integrador: plataforma de votación en alta disponibilidad
#   Usuario -> lb (Nginx, puerto 8089) -> nodo1 / nodo2 / nodo3 (red privada clusternet)
name: votacion-a

# Configuración común de los 3 nodos (ancla YAML: se reutiliza con <<: *nodo)
x-nodo: &nodo
  build: ./app
  image: votacion-a-app
  restart: unless-stopped
  volumes:
    - votos:/app/data            # los 3 nodos comparten los votos
  # Sin "ports": los nodos NO se publican hacia afuera, solo el balanceador.
  healthcheck:
    test: ["CMD", "wget", "-qO-", "http://localhost:9095/health"]
    interval: 5s
    timeout: 3s
    retries: 2
    start_period: 5s

services:
  nodo1:
    <<: *nodo
    hostname: nodo1
    environment:
      NODO: nodo1
    networks:
      clusternet:
        ipv4_address: 172.22.0.11

  nodo2:
    <<: *nodo
    hostname: nodo2
    environment:
      NODO: nodo2
    networks:
      clusternet:
        ipv4_address: 172.22.0.12

  nodo3:
    <<: *nodo
    hostname: nodo3
    environment:
      NODO: nodo3
    networks:
      clusternet:
        ipv4_address: 172.22.0.13

  lb:
    image: nginx:1.29-alpine
    restart: unless-stopped
    ports: ["8089:80"]           # único puerto abierto hacia afuera
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      clusternet:
        ipv4_address: 172.22.0.10
    # Nombres fijos de los nodos en /etc/hosts del lb: Nginx siempre los encuentra al
    # arrancar, aunque un nodo esté apagado.
    extra_hosts:
      - "nodo1:172.22.0.11"
      - "nodo2:172.22.0.12"
      - "nodo3:172.22.0.13"
    depends_on:
      nodo1: { condition: service_healthy }
      nodo2: { condition: service_healthy }
      nodo3: { condition: service_healthy }

networks:
  clusternet:
    ipam:
      config:
        - subnet: 172.22.0.0/24

volumes:
  votos:
